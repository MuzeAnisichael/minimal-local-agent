name: Release

# 推送 v* 标签时自动发布；已有标签可以手动触发（Actions → Release → Run workflow）。
# 发布说明取自默认分支的 docs/releases/<标签>.md，没有这个文件时用 GitHub 自动生成的说明。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有标签，例如 v2.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: 检出标签对应的代码
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: src
      - name: 检出发布说明
        uses: actions/checkout@v4
        with:
          path: meta
          sparse-checkout: docs/releases
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验版本号与标签一致
        working-directory: src
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$TAG" ]; then
            echo "pyproject.toml 的版本是 $version，与标签 $TAG 不一致" >&2
            exit 1
          fi
      - name: 测试与离线评测
        working-directory: src
        run: |
          python -m pip install -e ".[dev,mcp]"
          pytest
          python -m minimal_local_agent eval --offline --out eval-report.json
      - name: 构建 sdist 与 wheel
        working-directory: src
        run: |
          python -m pip install build
          python -m build
      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp src/eval-report.json eval-report-offline.json
          assets=(src/dist/* eval-report-offline.json)
          notes="meta/docs/releases/$TAG.md"
          title="$TAG"
          notes_args=()
          if [ -f "$notes" ]; then
            heading=$(sed -n 's/^## //p' "$notes" | head -n1)
            if [ -n "$heading" ]; then title="$TAG - ${heading#*：}"; fi
            notes_args=(--notes-file "$notes")
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" "${notes_args[@]}"
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            [ ${#notes_args[@]} -eq 0 ] && notes_args=(--generate-notes)
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$title" "${notes_args[@]}"
          fi
