name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装
        run: python -m pip install -e ".[dev,mcp]"
      - name: 格式检查
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: 测试
        run: pytest
      - name: 离线评测（脚本模型，验证恢复机制）
        run: python -m minimal_local_agent eval --offline --out eval-report.json
