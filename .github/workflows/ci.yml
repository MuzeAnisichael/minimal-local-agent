name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Check bundled Web assets
        run: >-
          python -c "import glob, zipfile; wheels=glob.glob('dist/*.whl');
          assert len(wheels)==1; names=zipfile.ZipFile(wheels[0]).namelist();
          assert all(any(name.endswith('/web_assets/'+asset) for name in names)
          for asset in ('index.html','app.css','app.js'))"

  mcp-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional MCP client
        run: python -m pip install -e ".[dev,mcp]"
      - name: Import MCP integration
        run: python -c "from minimal_local_agent.mcp import build_mcp_bundle"
      - name: Test MCP integration
        run: pytest tests/test_mcp.py
