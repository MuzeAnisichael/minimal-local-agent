[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-local-agent"
version = "2.0.0"
description = "有状态 Agent 执行内核：检查点、幂等工具账本、补偿恢复、事件轨迹与按任务族评测。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MuzeAnisichael" }]
keywords = ["agent", "llm", "checkpoint", "recovery", "evaluation", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic-ai-slim[openai]>=1.107.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.9,<1.0",
]
mcp = [
  "pydantic-ai-slim[mcp]>=1.107.1,<2.0.0",
  "mcp>=1.10,<2.0.0",
]

[project.scripts]
mla = "minimal_local_agent.cli:main"

[project.urls]
Homepage = "https://github.com/MuzeAnisichael/minimal-local-agent"
Source = "https://github.com/MuzeAnisichael/minimal-local-agent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 格式化器负责代码行宽；中文注释和长字符串不再单独报错。
ignore = ["E501"]
