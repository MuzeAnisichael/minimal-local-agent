[agent]
provider = "ollama"
model = "qwen3.5:9b"
base_url = "http://localhost:11434/v1"
# For another OpenAI Chat Completions-compatible service, change provider to
# "openai-compatible" in your ignored agent.toml. Use api_key_env = "MODEL_API_KEY"
# for a remote endpoint; put the actual key in that environment variable.
request_limit = 6
tool_calls_limit = 8
max_output_tokens = 2048
max_context_bytes = 64000 # serialized model-message bytes, not model tokens
temperature = 0.1
write_policy = "confirm" # "confirm", "preview", or "deny"

[paths]
workspace = "workspace"
database = ".minimal-local-agent/state.db"

[tools]
max_file_bytes = 200000
max_list_results = 200
max_search_results = 100
max_search_files = 500
max_transaction_files = 8
max_diff_chars = 40000
max_mcp_result_chars = 100000

# Optional v0.5 MCP clients are loopback-only and expose only explicitly named
# tools. Install support with: pip install -e ".[mcp]"
# [[mcp.servers]]
# name = "notes"
# url = "http://127.0.0.1:8000/mcp"
# allow_tools = ["search_notes", "read_note"]

[policy.tools]
# search_text = "deny"
# edit_files = "preview"
# count_files = "deny" # An explicitly registered Python read tool.
